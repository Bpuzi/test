<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <meta name="description" content="一个安静、温柔的匿名留言墙。">
  <title>匿名留言墙 · Anonymous Notes</title>
  <style>
    :root {
      --bg: #f5f3ff;
      --bg-deep: #ede9fe;
      --card: rgba(255, 255, 255, 0.78);
      --card-solid: #ffffff;
      --text: #241b3a;
      --muted: #716986;
      --line: rgba(93, 68, 145, 0.14);
      --primary: #7c3aed;
      --primary-deep: #6425d0;
      --primary-soft: #ede9fe;
      --pink: #ec4899;
      --shadow: 0 24px 70px rgba(75, 45, 130, 0.13);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(167, 139, 250, 0.34), transparent 30%),
        radial-gradient(circle at 88% 16%, rgba(244, 114, 182, 0.24), transparent 28%),
        linear-gradient(145deg, #faf9ff 0%, var(--bg) 48%, var(--bg-deep) 100%);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: 0.48;
      background-image:
        linear-gradient(rgba(124, 58, 237, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, 0.045) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    [hidden] {
      display: none !important;
    }

    .page-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 52px 0 34px;
    }

    .hero {
      position: relative;
      max-width: 820px;
      margin: 0 auto 34px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      color: var(--primary-deep);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(124, 58, 237, 0.16);
      border-radius: 999px;
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.08);
      backdrop-filter: blur(14px);
    }

    .badge::before {
      width: 7px;
      height: 7px;
      content: "";
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.12);
    }

    .hero h1 {
      margin: 22px 0 14px;
      font-family: Georgia, "Songti SC", "STSong", serif;
      font-size: clamp(42px, 8vw, 76px);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.05em;
      background: linear-gradient(115deg, #2e174f 10%, var(--primary) 52%, var(--pink) 96%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 650px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.8;
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(300px, 0.82fr) minmax(0, 1.48fr);
      gap: 24px;
      align-items: start;
    }

    .glass-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .composer {
      position: sticky;
      top: 24px;
      padding: 27px;
    }

    .section-kicker {
      display: block;
      margin-bottom: 8px;
      color: var(--primary);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .composer h2,
    .wall-title h2 {
      margin: 0;
      font-size: 23px;
      letter-spacing: -0.03em;
    }

    .composer-copy {
      margin: 11px 0 21px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      color: #514866;
      font-size: 13px;
      font-weight: 750;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 164px;
      padding: 16px 17px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.75;
      resize: vertical;
      outline: none;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    textarea::placeholder {
      color: #aaa3b8;
    }

    textarea:focus {
      background: #ffffff;
      border-color: rgba(124, 58, 237, 0.52);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
    }

    .textarea-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .anonymous-note {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }

    .anonymous-note::before {
      width: 8px;
      height: 8px;
      content: "";
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
    }

    .mood-label {
      display: block;
      margin: 20px 0 10px;
      color: #514866;
      font-size: 13px;
      font-weight: 750;
    }

    .mood-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mood-picker label {
      position: relative;
      cursor: pointer;
    }

    .mood-picker input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mood-picker span {
      display: inline-flex;
      align-items: center;
      padding: 8px 11px;
      color: #625974;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: transform 160ms ease, color 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .mood-picker label:hover span {
      transform: translateY(-1px);
      border-color: rgba(124, 58, 237, 0.3);
    }

    .mood-picker input:checked + span {
      color: var(--primary-deep);
      background: var(--primary-soft);
      border-color: rgba(124, 58, 237, 0.32);
      box-shadow: 0 7px 18px rgba(124, 58, 237, 0.1);
    }

    .publish-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      margin-top: 22px;
      padding: 14px 18px;
      color: #ffffff;
      font-weight: 850;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--primary-deep));
      border-radius: 15px;
      box-shadow: 0 14px 30px rgba(124, 58, 237, 0.25);
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
    }

    .publish-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(124, 58, 237, 0.31);
      filter: saturate(1.12);
    }

    .publish-button:active:not(:disabled) {
      transform: translateY(0);
    }

    .publish-button:disabled {
      cursor: not-allowed;
      opacity: 0.52;
      box-shadow: none;
    }

    .local-tip {
      margin: 15px 0 0;
      color: #817a92;
      font-size: 11px;
      line-height: 1.65;
      text-align: center;
    }

    .wall {
      min-height: 560px;
      padding: 27px;
    }

    .wall-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .message-count {
      flex: 0 0 auto;
      padding: 7px 11px;
      color: var(--primary-deep);
      font-size: 12px;
      font-weight: 800;
      background: var(--primary-soft);
      border-radius: 999px;
    }

    .message-list {
      display: grid;
      gap: 14px;
      padding-top: 20px;
    }

    .message-card {
      position: relative;
      padding: 19px 19px 17px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(93, 68, 145, 0.11);
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 30px rgba(70, 51, 103, 0.055);
      animation: cardIn 420ms both;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .message-card::after {
      position: absolute;
      top: -48px;
      right: -48px;
      width: 102px;
      height: 102px;
      content: "";
      opacity: 0.42;
      background: radial-gradient(circle, var(--accent), transparent 68%);
      border-radius: 50%;
      pointer-events: none;
    }

    .message-card:hover {
      transform: translateY(-2px);
      border-color: rgba(124, 58, 237, 0.22);
      box-shadow: 0 16px 36px rgba(70, 51, 103, 0.09);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(9px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-top {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-right: 34px;
    }

    .avatar {
      display: grid;
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      place-items: center;
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      background: linear-gradient(145deg, var(--avatar-a), var(--avatar-b));
      border-radius: 13px;
      box-shadow: 0 8px 18px color-mix(in srgb, var(--avatar-a) 27%, transparent);
    }

    .message-author {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .message-author strong {
      font-size: 13px;
    }

    .message-time {
      color: #91899f;
      font-size: 11px;
    }

    .mood-chip {
      display: inline-flex;
      padding: 4px 8px;
      color: #6f4a0a;
      font-size: 10px;
      font-weight: 800;
      background: #fff5d7;
      border-radius: 999px;
    }

    .message-text {
      margin: 15px 0 17px;
      color: #372d4b;
      font-size: 15px;
      line-height: 1.82;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .like-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      color: #776d89;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      background: #f6f3fb;
      border-radius: 999px;
      transition: color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .like-button:hover {
      color: var(--pink);
      background: #fff0f7;
      transform: translateY(-1px);
    }

    .like-button.is-liked {
      color: #db2777;
      background: #ffe8f4;
    }

    .like-heart {
      font-size: 14px;
      line-height: 1;
    }

    .delete-button {
      padding: 6px 8px;
      color: #a49cad;
      font-size: 11px;
      cursor: pointer;
      background: transparent;
      border-radius: 8px;
      transition: color 160ms ease, background 160ms ease;
    }

    .delete-button:hover {
      color: #dc2626;
      background: #fef2f2;
    }

    .shared-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8b819d;
      font-size: 11px;
      font-weight: 750;
    }

    .shared-meta::before {
      width: 7px;
      height: 7px;
      content: "";
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
    }

    .empty-state {
      display: grid;
      min-height: 350px;
      place-items: center;
      padding: 44px 20px;
      text-align: center;
    }

    .empty-illustration {
      position: relative;
      width: 92px;
      height: 92px;
      margin: 0 auto 20px;
      background: linear-gradient(145deg, #ede9fe, #fce7f3);
      border: 1px solid rgba(124, 58, 237, 0.12);
      border-radius: 30px;
      box-shadow: 0 18px 35px rgba(124, 58, 237, 0.12);
      transform: rotate(-5deg);
    }

    .empty-illustration::before,
    .empty-illustration::after {
      position: absolute;
      content: "";
      background: #ffffff;
      border-radius: 50%;
    }

    .empty-illustration::before {
      top: 27px;
      left: 25px;
      width: 10px;
      height: 10px;
      box-shadow: 32px 0 0 #ffffff;
    }

    .empty-illustration::after {
      bottom: 25px;
      left: 50%;
      width: 38px;
      height: 12px;
      border-radius: 0 0 20px 20px;
      transform: translateX(-50%);
    }

    .empty-state h3 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .empty-state p {
      max-width: 330px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    footer {
      padding: 30px 0 0;
      color: #898198;
      font-size: 12px;
      text-align: center;
    }

    footer strong {
      color: var(--primary);
    }

    @media (max-width: 860px) {
      .page-shell {
        width: min(100% - 22px, 720px);
        padding-top: 34px;
      }

      .main-grid {
        grid-template-columns: 1fr;
      }

      .composer {
        position: static;
      }

      .wall {
        min-height: 420px;
      }
    }

    @media (max-width: 520px) {
      .hero {
        margin-bottom: 24px;
      }

      .hero h1 {
        font-size: 44px;
      }

      .composer,
      .wall {
        padding: 20px;
        border-radius: 24px;
      }

      .wall-header {
        align-items: center;
      }

      .message-card {
        padding: 17px;
      }

      .message-top {
        padding-right: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="badge">Anonymous Notes</div>
      <h1>匿名留言墙</h1>
      <p>有些话不必署名，也值得被认真听见。在这里留下一点心情、一个秘密，或只是想对世界说的话。</p>
    </header>

    <main class="main-grid">
      <section class="composer glass-card" aria-labelledby="composerTitle">
        <span class="section-kicker">Leave a note</span>
        <h2 id="composerTitle">写下想说的话</h2>
        <p class="composer-copy">无需登录，完全匿名。请保持友善，不发布他人隐私或攻击性内容。</p>

        <form id="messageForm">
          <label class="field-label" for="messageInput">留言内容</label>
          <textarea
            id="messageInput"
            maxlength="200"
            placeholder="此刻，你想说些什么？"
            required
            aria-describedby="messageCounter"
          ></textarea>

          <div class="textarea-foot">
            <span id="messageCounter">0 / 200</span>
            <span class="anonymous-note">完全匿名</span>
          </div>

          <span class="mood-label">给这条留言一个心情</span>
          <div class="mood-picker" role="radiogroup" aria-label="选择留言心情">
            <label>
              <input type="radio" name="mood" value="🌙 树洞" checked>
              <span>🌙 树洞</span>
            </label>
            <label>
              <input type="radio" name="mood" value="☀️ 开心">
              <span>☀️ 开心</span>
            </label>
            <label>
              <input type="radio" name="mood" value="🌿 治愈">
              <span>🌿 治愈</span>
            </label>
            <label>
              <input type="radio" name="mood" value="🫧 随想">
              <span>🫧 随想</span>
            </label>
          </div>

          <button class="publish-button" id="publishButton" type="submit" disabled>
            <span>发布留言</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <p class="local-tip" id="setupTip">正在连接公共留言墙...</p>
      </section>

      <section class="wall glass-card" aria-labelledby="wallTitle">
        <div class="wall-header">
          <div class="wall-title">
            <span class="section-kicker">Message wall</span>
            <h2 id="wallTitle">大家的留言</h2>
          </div>
          <span class="message-count" id="messageCount">0 条</span>
        </div>

        <div class="message-list" id="messageList" aria-live="polite"></div>

        <div class="empty-state" id="emptyState">
          <div>
            <div class="empty-illustration" aria-hidden="true"></div>
            <h3>这里还很安静</h3>
            <p>成为第一个留下声音的人吧。你不需要署名，只需要真诚。</p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      愿每一句没有署名的话，都能被温柔接住 · <strong>Anonymous Notes</strong>
    </footer>
  </div>

﻿  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ============================================================
    // 1. 在这里填写 Supabase 项目的 URL 和 anon public key
    // 注意：只能填写 anon public key，不能填写 service_role key。
    // ============================================================
    const SUPABASE_URL = "https://cwnkkhudpgpakzrzyihn.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "sb_publishable_l_8oAhU9vFigjUYndNnlRA_mKIGLRNw";
    const TABLE_NAME = "messages";
    const MAX_LENGTH = 200;
    const MAX_MESSAGES = 100;

    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const messageCounter = document.getElementById("messageCounter");
    const publishButton = document.getElementById("publishButton");
    const messageList = document.getElementById("messageList");
    const messageCount = document.getElementById("messageCount");
    const emptyState = document.getElementById("emptyState");
    const setupTip = document.getElementById("setupTip");

    const supabaseLibraryReady =
      typeof window.supabase !== "undefined" &&
      typeof window.supabase.createClient === "function";

    const isConfigured =
      supabaseLibraryReady &&
      SUPABASE_URL.startsWith("https://") &&
      SUPABASE_ANON_KEY.length > 20;

    const db = isConfigured
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const avatarPalettes = [
      ["#8b5cf6", "#6366f1"],
      ["#ec4899", "#f97316"],
      ["#06b6d4", "#3b82f6"],
      ["#10b981", "#14b8a6"],
      ["#f59e0b", "#ef4444"],
      ["#a855f7", "#ec4899"]
    ];

    let messages = [];
    let isSubmitting = false;
    let realtimeChannel = null;

    function formatTime(isoString) {
      const date = new Date(isoString);
      if (Number.isNaN(date.getTime())) {
        return "刚刚";
      }

      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function getAvatarStyle(id) {
      const safeId = String(id || "anonymous");
      let hash = 0;

      for (let i = 0; i < safeId.length; i += 1) {
        hash = (hash * 31 + safeId.charCodeAt(i)) >>> 0;
      }

      const palette = avatarPalettes[hash % avatarPalettes.length];
      return `--avatar-a:${palette[0]};--avatar-b:${palette[1]};`;
    }

    function normalizeMessage(row) {
      return {
        id: row.id,
        text: row.content || "",
        mood: row.mood || "🌙 树洞",
        createdAt: row.created_at || new Date().toISOString()
      };
    }

    function updateCounter() {
      const text = messageInput.value.trim();
      messageCounter.textContent = `${messageInput.value.length} / ${MAX_LENGTH}`;
      publishButton.disabled = isSubmitting || !isConfigured || text.length === 0;
    }

    function getSelectedMood() {
      const selected = messageForm.querySelector('input[name="mood"]:checked');
      return selected ? selected.value : "🌙 树洞";
    }

    function createMessageCard(message, index) {
      const card = document.createElement("article");
      card.className = "message-card";
      card.style.setProperty("--accent", avatarPalettes[index % avatarPalettes.length][0]);
      card.style.animationDelay = `${Math.min(index * 45, 270)}ms`;

      const top = document.createElement("div");
      top.className = "message-top";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "匿";
      avatar.style.cssText = getAvatarStyle(message.id);
      avatar.setAttribute("aria-hidden", "true");

      const author = document.createElement("div");
      author.className = "message-author";

      const name = document.createElement("strong");
      name.textContent = "一位匿名朋友";

      const time = document.createElement("time");
      time.className = "message-time";
      time.dateTime = message.createdAt;
      time.textContent = formatTime(message.createdAt);

      const mood = document.createElement("span");
      mood.className = "mood-chip";
      mood.textContent = message.mood;

      author.append(name, time, mood);
      top.append(avatar, author);

      const text = document.createElement("p");
      text.className = "message-text";
      text.textContent = message.text;

      const bottom = document.createElement("div");
      bottom.className = "message-bottom";

      const sharedMeta = document.createElement("span");
      sharedMeta.className = "shared-meta";
      sharedMeta.textContent = "已同步到公共留言墙";

      bottom.append(sharedMeta);
      card.append(top, text, bottom);
      return card;
    }

    function renderMessages() {
      messageList.replaceChildren();
      messageCount.textContent = `${messages.length} 条`;

      if (messages.length === 0) {
        emptyState.hidden = false;
        return;
      }

      emptyState.hidden = true;
      messages.forEach((message, index) => {
        messageList.append(createMessageCard(message, index));
      });
    }

    async function fetchMessages() {
      const { data, error } = await db
        .from(TABLE_NAME)
        .select("id,content,mood,created_at")
        .order("created_at", { ascending: false })
        .limit(MAX_MESSAGES);

      if (error) {
        throw error;
      }

      return (data || []).map(normalizeMessage);
    }

    function subscribeToMessages() {
      if (!db || realtimeChannel) {
        return;
      }

      realtimeChannel = db
        .channel("anonymous-message-wall")
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: TABLE_NAME
          },
          (payload) => {
            const newMessage = normalizeMessage(payload.new);
            const alreadyExists = messages.some((message) => message.id === newMessage.id);

            if (!alreadyExists) {
              messages.unshift(newMessage);
              renderMessages();
            }
          }
        )
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            setupTip.textContent = "已连接公共留言墙，新留言会实时同步。";
          }
        });
    }

    async function loadSharedMessages() {
      if (!isConfigured) {
        setupTip.textContent = supabaseLibraryReady
          ? "请先在代码中填写 SUPABASE_URL 和 SUPABASE_ANON_KEY。"
          : "Supabase 脚本加载失败，请检查网络或 CDN 地址。";
        renderMessages();
        return;
      }

      setupTip.textContent = "正在读取公共留言...";

      try {
        messages = await fetchMessages();
        renderMessages();
        subscribeToMessages();
      } catch (error) {
        console.error("读取留言失败：", error);
        setupTip.textContent = `连接失败：${error.message}`;
        renderMessages();
      }
    }

    messageInput.addEventListener("input", updateCounter);

    messageInput.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        if (!publishButton.disabled) {
          messageForm.requestSubmit();
        }
      }
    });

    messageForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!db) {
        setupTip.textContent = "尚未连接 Supabase，暂时不能发布留言。";
        return;
      }

      const text = messageInput.value.trim();
      if (!text) {
        messageInput.focus();
        return;
      }

      isSubmitting = true;
      updateCounter();
      setupTip.textContent = "正在发布留言...";

      try {
        const { data, error } = await db
          .from(TABLE_NAME)
          .insert({
            content: text.slice(0, MAX_LENGTH),
            mood: getSelectedMood()
          })
          .select("id,content,mood,created_at")
          .single();

        if (error) {
          throw error;
        }

        const newMessage = normalizeMessage(data);
        const alreadyExists = messages.some((message) => message.id === newMessage.id);

        if (!alreadyExists) {
          messages.unshift(newMessage);
        }

        messageInput.value = "";
        setupTip.textContent = "留言发布成功，已经同步到公共留言墙。";
        renderMessages();
        messageInput.focus();
      } catch (error) {
        console.error("发布留言失败：", error);
        setupTip.textContent = `发布失败：${error.message}`;
      } finally {
        isSubmitting = false;
        updateCounter();
      }
    });

    updateCounter();
    renderMessages();
    loadSharedMessages();
  </script>
</body>
</html>
